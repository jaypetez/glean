name: Claude PR Review

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]
    paths:
      - 'src/**/*.py'
      - 'ui/src/**/*.ts'
      - 'ui/src/**/*.svelte'
      - 'ui/src/**/*.js'
      - '.github/workflows/**'
      - 'pyproject.toml'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - id: claude-auth
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ] || [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Claude auth not configured; skipping review."
          fi
      - if: steps.claude-auth.outputs.configured == 'true'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - if: steps.claude-auth.outputs.configured == 'true'
        uses: anthropics/claude-code-action@51ea8ea73a139f2a74ff649e3092c25a904aed7e # v1.0.123
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Review PR #${{ github.event.pull_request.number }} for the glean repo.

            Focus areas (in priority order):
            1. Security: SSRF (validate_url calls), prompt injection, secret scrubbing, missing escape
            2. Correctness: Item mutation (must use dataclasses.replace), missing effective_*() calls
            3. Failure model: missing retries, unhandled exceptions, alert_active not cleared
            4. CodeQL flags: bare `...`, empty `except: pass` without comment

            File comments only on issues that genuinely matter. Avoid style/formatting nits.
            Do not request changes; post observations as a single review comment.
          claude_args: >-
            --allowedTools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(git diff:*),Bash(gh pr comment:*),Read"
            --max-turns 12
