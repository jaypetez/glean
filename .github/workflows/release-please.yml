name: release-please

# IMPORTANT: This workflow needs "Allow GitHub Actions to create and approve
# pull requests" enabled at:
#   Settings → Actions → General → Workflow permissions
# Without it, the action fails with:
#   "GitHub Actions is not permitted to create or approve pull requests"
#
# Alternative: set RELEASE_PLEASE_TOKEN to a personal access token (or fine-grained
# token) with contents:write + pull-requests:write on this repo.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/release-please-action@v4
        id: release
        with:
          release-type: python
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
