name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Build & publish image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build & push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign container image
        run: |
          cosign sign --yes \
            "ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}"

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: "ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}"
          artifact-name: sbom-${{ github.ref_name }}.spdx.json

  binaries:
    name: Build binary (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: glean-linux-x86_64
            ext: ""
          - os: ubuntu-24.04-arm
            artifact: glean-linux-arm64
            ext: ""
          - os: macos-14
            artifact: glean-macos-arm64
            ext: ""
          - os: windows-latest
            artifact: glean-windows-x86_64
            ext: ".exe"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: '0.5.13'

      - name: Install dependencies + PyInstaller
        run: |
          uv venv .venv
          uv pip install . pyinstaller

      - name: Build binary
        shell: bash
        run: |
          source .venv/bin/activate || . .venv/Scripts/activate
          pyinstaller glean.spec --distpath dist/
          mv dist/glean${{ matrix.ext }} dist/${{ matrix.artifact }}${{ matrix.ext }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}${{ matrix.ext }}
          retention-days: 5

  linux-packages:
    name: Build Linux packages
    runs-on: ubuntu-latest
    needs: [binaries]
    steps:
      - uses: actions/checkout@v6

      - name: Download Linux x86_64 binary
        uses: actions/download-artifact@v4
        with:
          name: glean-linux-x86_64
          path: dist/

      - name: Install nfpm
        run: |
          NFPM_VERSION=2.46.3
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" | tar xz -C /usr/local/bin nfpm

      - name: Build .deb, .rpm, .apk
        run: |
          chmod +x dist/glean-linux-x86_64
          VERSION="${GITHUB_REF_NAME#v}"
          for fmt in deb rpm apk; do
            ARCH=amd64 ARCH_LABEL=x86_64 VERSION="$VERSION" \
              nfpm package --config packaging/nfpm.yaml --packager "$fmt" --target dist/
          done

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.apk
          retention-days: 5

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [image, binaries, linux-packages]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: glean-*
          merge-multiple: true
          path: dist/

      - name: Download Linux packages
        uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: dist/

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*

