name: stale

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-issue-stale: 60
          days-before-issue-close: 14
          stale-issue-label: "stale"
          exempt-issue-labels: "pinned,security,roadmap,help wanted,good first issue"
          stale-issue-message: >-
            This issue has been inactive for 60 days. It will be closed in 14 days if there's no further activity.
            Drop a comment if it's still relevant — that resets the clock.
          close-issue-message: >-
            Closing as stale. Happy to reopen if it's still a problem — just leave a comment.

          days-before-pr-stale: 30
          days-before-pr-close: 14
          stale-pr-label: "stale"
          exempt-pr-labels: "pinned,security,wip"
          stale-pr-message: >-
            This PR has been inactive for 30 days. It will be closed in 14 days if there's no further activity.
            If you're still working on it, a comment or push resets the timer.
          close-pr-message: >-
            Closing as stale. Reopen anytime if you want to pick it back up.

          operations-per-run: 100
