<!--
  glean — favicon (32x32 native, scales to 16x16)
  ===============================================
  Inlines a dark-surface background so the mark stays legible in both
  light and dark browser tabs. Same geometry as glean-mark.svg but
  on a rounded square with the brand surface color.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="12" fill="#0e1730" />
  <path
    d="M 32 10 A 22 22 0 1 0 54 32"
    fill="none"
    stroke="#22d3ee"
    stroke-width="6"
    stroke-linecap="round"
  />
  <path
    d="M 54 32 L 40 32"
    fill="none"
    stroke="#22d3ee"
    stroke-width="6"
    stroke-linecap="round"
  />
  <circle cx="28" cy="28" r="4" fill="#22d3ee" />
</svg>
