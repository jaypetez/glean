<!--
  glean — horizontal logo lockup (for dark backgrounds)
  =====================================================
  Same geometry as glean-logo.svg but with a light wordmark color so it
  reads on dark surfaces (the web UI, dark-mode docs, social cards).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" role="img" aria-label="glean">
  <title>glean</title>

  <g>
    <path
      d="M 32 10 A 22 22 0 1 0 54 32"
      fill="none"
      stroke="#22d3ee"
      stroke-width="6"
      stroke-linecap="round"
    />
    <path
      d="M 54 32 L 40 32"
      fill="none"
      stroke="#22d3ee"
      stroke-width="6"
      stroke-linecap="round"
    />
    <circle cx="28" cy="28" r="4" fill="#22d3ee" />
  </g>

  <text
    x="76"
    y="44"
    font-family="Inter, 'Inter Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
    font-size="36"
    font-weight="600"
    letter-spacing="-0.02em"
    fill="#f1f5f9"
  >glean</text>
</svg>
