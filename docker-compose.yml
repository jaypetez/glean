services:
  glean:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/jaypetez/glean:latest
    container_name: glean
    init: true
    stop_grace_period: 30s
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    depends_on:
      - ollama
    env_file:
      - .env
    environment:
      TZ: ${TZ:-UTC}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./data:/data
      - ./feeds.yaml:/etc/glean/feeds.yaml:ro
    networks:
      - glean
    ports:
      - "127.0.0.1:9090:9090"   # health endpoint (loopback only)

  ollama:
    image: ollama/ollama:latest
    container_name: glean-ollama
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /root/.cache:size=256m,mode=0700
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - glean
    # Uncomment for NVIDIA GPU passthrough:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    # Uncomment to expose Ollama to the host:
    # ports:
    #   - "11434:11434"

  # ────────────────────────────────────────────────────────────────────────────
  # Optional: Self-hosted SearXNG metasearch — no API key needed.
  #
  # 1. Uncomment this service block.
  # 2. Generate a secret: echo "SEARXNG_SECRET=$(openssl rand -hex 32)" >> .env
  # 3. The config template is already at ./searxng-config/settings.yml
  # 4. Start: docker compose up -d
  # 5. Add a search source to feeds.yaml:
  #
  #      sources:
  #        - type: search
  #          query: "your topic"
  #          engine: searxng
  #          base_url: http://searxng:8080
  #
  # See docs/getting-started/search.md for the full guide.
  # ────────────────────────────────────────────────────────────────────────────
  #
  # searxng:
  #   image: ghcr.io/searxng/searxng:latest
  #   container_name: glean-searxng
  #   restart: unless-stopped
  #   cap_drop:
  #     - ALL
  #   security_opt:
  #     - no-new-privileges:true
  #   read_only: true
  #   tmpfs:
  #     - /tmp:size=64m,mode=1777
  #   environment:
  #     SEARXNG_BASE_URL: http://searxng:8080/
  #     SEARXNG_SECRET: ${SEARXNG_SECRET}
  #   volumes:
  #     - ./searxng-config:/etc/searxng:rw
  #   networks:
  #     - glean
  #   # Internal network only — do NOT expose to host

volumes:
  ollama-models:

networks:
  glean:
    driver: bridge
