name: glean-ex01

services:
  glean:
    image: ghcr.io/jaypetez/glean:latest
    container_name: glean-ex01-glean
    init: true
    stop_grace_period: 30s
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    depends_on:
      ollama:
        condition: service_healthy
      searxng:
        condition: service_healthy
    env_file:
      - .env
    environment:
      TZ: ${TZ:-UTC}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./data:/data
      - ./feeds.yaml:/etc/glean/feeds.yaml:ro
    networks:
      - glean-ex01
    ports:
      - "127.0.0.1:9091:9090"   # different host port so it can run alongside a real glean install

  ollama:
    image: ollama/ollama:latest
    container_name: glean-ex01-ollama
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - ./data/ollama:/root/.ollama
    networks:
      - glean-ex01
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    # Uncomment for NVIDIA GPU passthrough (requires nvidia-container-toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  searxng:
    image: ghcr.io/searxng/searxng:latest
    container_name: glean-ex01-searxng
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      SEARXNG_SECRET: ${SEARXNG_SECRET}
      FORCE_OWNERSHIP: "false"
    entrypoint:
      - /bin/sh
      - -ec
      - |
        if ! printf '%s' "$${SEARXNG_SECRET}" | grep -Eq '^[0-9a-fA-F]{32,}$$'; then
          echo >&2 "ERROR: SEARXNG_SECRET must be 32+ hex characters."
          echo >&2 "Run setup.sh / setup.ps1 to generate one."
          exit 1
        fi
        exec /usr/local/searxng/entrypoint.sh
    volumes:
      - ./searxng-config:/etc/searxng:ro
    networks:
      - glean-ex01
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz | grep -q 'OK' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    # Internal network only — do NOT expose to the host.

networks:
  glean-ex01:
    name: glean-ex01
    driver: bridge
