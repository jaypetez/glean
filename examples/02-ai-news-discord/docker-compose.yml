name: glean-ex02

services:
  glean:
    image: ghcr.io/jaypetez/glean:latest
    container_name: glean-ex02-glean
    init: true
    stop_grace_period: 30s
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    depends_on:
      ollama:
        condition: service_healthy
    env_file:
      - .env
    environment:
      TZ: ${TZ:-UTC}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./data:/data
      - ./feeds.yaml:/etc/glean/feeds.yaml:ro
    networks:
      - glean-ex02
    ports:
      - "127.0.0.1:9092:9090"

  ollama:
    image: ollama/ollama:latest
    container_name: glean-ex02-ollama
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - ./data/ollama:/root/.ollama
    networks:
      - glean-ex02
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

networks:
  glean-ex02:
    name: glean-ex02
    driver: bridge
