[project]
name = "glean"
version = "1.3.0"
description = "Pluggable content aggregator that summarizes feeds via LLM and posts digests to Telegram."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jayson Petersen" }]
keywords = ["telegram", "rss", "ollama", "llm", "digest", "bot"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "python-telegram-bot>=22.0",
    "ollama>=0.4.0",
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "feedparser>=6.0.12",
    "trafilatura>=2.0.0",
    "httpx>=0.28.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=3.4.4",
    "apscheduler>=4.0.0a6",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "ruamel.yaml>=0.19.1",
    "aiosqlite>=0.20",
    "yoyo-migrations>=8.2",
    "structlog>=25.5.0",
    "typer>=0.15",
    "aiohttp>=3.10",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-rerunfailures>=16.2",
    "pytest-timeout>=2.3",
    "pytest-randomly>=3.15",
    "pytest-xdist>=3.6",
    "watchfiles>=0.21",
    "respx>=0.23.1",
    "time-machine>=2.16",
    "ruff>=0.15.13",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "bandit>=1.8",
    "pip-audit>=2.9",
    "hypothesis>=6.115",
    "mcp>=1.0",
    "schemathesis>=3.40",
    "types-PyYAML",
    "mkdocs-material[imaging]>=9.5",
    "mkdocs-swagger-ui-tag>=0.6",
    "mkdocs-git-revision-date-localized-plugin>=1.2",
    "mkdocs-minify-plugin>=0.8",
    "typer-cli>=0.12",
]
docs = [
    "mkdocs-material[imaging]>=9.5",
    "mkdocs-swagger-ui-tag>=0.6",
    "mkdocs-git-revision-date-localized-plugin>=1.2",
    "mkdocs-minify-plugin>=0.8",
    "mkdocstrings[python]>=0.27",
]

[project.scripts]
glean = "glean.cli.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/glean"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "C4", "RET", "SIM", "PL", "T20", "ERA001", "RUF100"]
ignore = [
    "S101",     # asserts are fine
    "PLR0913",  # many keyword args are fine for config models
    "PLR2004",  # magic-value comparisons read fine in practice
    "PLR0912",  # branching in the pipeline state machine
    "PLR0915",  # statements in the pipeline state machine
    "SIM108",   # ternary readability is debatable
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T201"]                                     # print is intentional in scripts
"tests/**" = ["S", "PLR2004", "PLC0415", "T201"]
"src/glean/cli/**" = ["PLC0415"]                          # lazy imports keep CLI startup fast
"src/glean/sources/registry.py" = ["PLC0415"]             # late import avoids decorator cycle
"src/glean/llm/registry.py" = ["PLC0415"]                 # late import avoids decorator cycle
"src/glean/sinks/registry.py" = ["PLC0415"]               # late import avoids decorator cycle
"src/glean/search/registry.py" = ["PLC0415"]              # late import avoids decorator cycle

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
disallow_any_generics = true

[[tool.mypy.overrides]]
module = ["feedparser", "trafilatura", "ollama", "yoyo"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not e2e'"
markers = [
    "e2e: marks tests as end-to-end (requires docker compose)",
]
