# Feed configuration for E2E testing.
# Pointed at mock services running in docker-compose.e2e.yml.
defaults:
  llm:
    provider: ollama
    model: mock-model
    base_url: http://mock-ollama:11434
  render:
    style: html
    max_items: 10
  bootstrap: send-all   # send all items immediately for E2E (no skip-and-mark wait)
  failure:
    alert_after: 99   # don't trigger alerts during testing

skills:
  - name: e2e-extractor
    description: "E2E mock skill — extracts a summary and a score."
    prompt: |
      Extract from:
      TITLE: {title}
      BODY: {body}
    output_schema:
      summary: str
      score: float
      tags: "list[str]"

feeds:
  - name: e2e-feed
    schedule: "every 10s"   # fast tick for testing
    sinks:
      - type: telegram
        chat_id: "1234"
    sources:
      - type: rss
        url: http://mock-rss:8002/feed.xml
    pipeline:
      - dedup
      - summarize:
          prompt: "Summarize in one short sentence."
      - digest:
          intro: "<b>E2E test digest</b>"

  - name: e2e-search-feed
    schedule: "every 10s"
    sinks:
      - type: telegram
        chat_id: "5678"
    sources:
      - type: search
        query: "mock test query"
        engine: searxng
        base_url: http://mock-searxng:8003
    pipeline:
      - dedup
      - summarize:
          prompt: "Summarize in one short sentence."
      - digest:
          intro: "<b>E2E search digest</b>"

  - name: e2e-skills-feed
    schedule: "every 10s"
    sinks:
      - type: telegram
        chat_id: "9999"
    sources:
      - type: rss
        url: http://mock-rss:8002/feed.xml
        llm:
          provider: ollama
          model: mock-special
          base_url: http://mock-ollama:11434
    pipeline:
      - dedup
      - apply_skill:
          skill: e2e-extractor
      - digest:
          intro: "<b>E2E skills digest</b>"
